# Settings shared by every experiment. They keep runs fast and results small.
[General]
cmdenv-express-mode = true
cmdenv-log-level = off
cmdenv-status-frequency = 60s
cmdenv-performance-display = false

# Scalars hold the final KPIs. Per-event vectors are the main cause of huge
# result files, so they stay off except where a config turns them on.
**.vector-recording = false
**.bin-recording = false
record-eventlog = false

# Plan: at least 10 seeds, 60 s simulated. The first 5 s is warm-up.
repeat = 10
sim-time-limit = 60s
warmup-period = 5s
seed-set = ${repetition}
output-scalar-file = ${resultdir}/${configname}-${iterationvarsf}#${repetition}.sca
