# Settings shared by every experiment. They keep runs fast and results small.
cmdenv-express-mode = true
**.cmdenv-log-level = off
cmdenv-status-frequency = 60s
cmdenv-performance-display = false

record-eventlog = false

# Plan: at least 10 seeds, 60 s simulated. The first 5 s is warm-up.
repeat = 10
sim-time-limit = 60s
warmup-period = 5s
seed-set = ${repetition}
