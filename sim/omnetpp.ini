# Work Plan scenarios on one zonal segment. Offered load is a share of 10 Mb/s.
# All followers send to the controller, the zone's uplink.
#
# Frame mix, as in the Python model: 64-1518 bytes, 3478.4 bit times on average.
# Each size class is its own Poisson stream, so the sum is Poisson with this mix.

[General]
include common.ini
network = ZonalSegment
**.numNodes = ${numNodes=8}
*.*.ethernet.hasSocketSupport = true
*.*.eth[*].plca.max_bc = ${maxBc=0}

# Each node's transmit queue holds 64 frames, as in the Python model.
*.node[*].eth[*].queue.typename = "DropTailQueue"
*.node[*].eth[*].queue.packetCapacity = 64

# One sink per follower, so latency is known per node.
*.controller.numApps = ${numNodes}
*.controller.app[*].typename = "EthernetSinkApp"
*.controller.app[*].io.steal = true
*.controller.app[*].io.interface = "eth0"
*.controller.app[*].io.localAddress = "controller"
*.controller.app[*].io.remoteAddress = "node[" + string(ancestorIndex(1)) + "]"

*.node[*].app[*].typename = "EthernetSourceApp"
*.node[*].app[*].io.interface = "eth0"
*.node[*].app[*].io.remoteAddress = "controller"

# Latency per frame is the one vector kept. collect.py reduces it to one row
# per run and removes the raw file, so disk use stays small.
**.controller.app[*].**.meanBitLifeTimePerPacket:vector.vector-recording = true
**.vector-recording = false
# Cycle length and TO use as scalars, so no per-cycle vector is written.
*.controller.eth[*].plca.cycleLength.result-recording-modes = mean,max
*.*.eth[*].plca.transmitOpportunityUsed.result-recording-modes = mean
**.scalar-recording = true
**.bin-recording = false

[FrameMix]
abstract = true
*.node[*].numApps = 6
*.node[*].app[0].source.packetLength = 46B
*.node[*].app[1].source.packetLength = 110B
*.node[*].app[2].source.packetLength = 238B
*.node[*].app[3].source.packetLength = 494B
*.node[*].app[4].source.packetLength = 1006B
*.node[*].app[5].source.packetLength = 1500B
[S1_S2_Uniform]
description = "S1 low and S2 increasing load: equal Poisson load on all followers"
extends = FrameMix
*.node[*].app[0].source.productionInterval = exponential(3478.4e-7s * ${numNodes} / ${load=0.25,0.3,0.5,0.7,0.9} / 0.30)
*.node[*].app[1].source.productionInterval = exponential(3478.4e-7s * ${numNodes} / ${load} / 0.20)
*.node[*].app[2].source.productionInterval = exponential(3478.4e-7s * ${numNodes} / ${load} / 0.15)
*.node[*].app[3].source.productionInterval = exponential(3478.4e-7s * ${numNodes} / ${load} / 0.15)
*.node[*].app[4].source.productionInterval = exponential(3478.4e-7s * ${numNodes} / ${load} / 0.10)
*.node[*].app[5].source.productionInterval = exponential(3478.4e-7s * ${numNodes} / ${load} / 0.10)

[S2_Scale]
description = "Plan 2.1 sweep: 4, 12 and 16 followers. 8 followers is S1_S2_Uniform."
extends = FrameMix
**.numNodes = ${nodes=4,12,16}
*.controller.numApps = ${nodes}
*.node[*].app[0].source.productionInterval = exponential(3478.4e-7s * ${nodes} / ${load=0.25,0.3,0.5,0.7,0.9} / 0.30)
*.node[*].app[1].source.productionInterval = exponential(3478.4e-7s * ${nodes} / ${load} / 0.20)
*.node[*].app[2].source.productionInterval = exponential(3478.4e-7s * ${nodes} / ${load} / 0.15)
*.node[*].app[3].source.productionInterval = exponential(3478.4e-7s * ${nodes} / ${load} / 0.15)
*.node[*].app[4].source.productionInterval = exponential(3478.4e-7s * ${nodes} / ${load} / 0.10)
*.node[*].app[5].source.productionInterval = exponential(3478.4e-7s * ${nodes} / ${load} / 0.10)

[S3_Bursty]
description = "S3: 30 % of load Poisson, 70 % in bursts of about 8 frames"
extends = FrameMix
# A burst is frames 1 us apart. With chance 7/8 the next frame follows at once.
*.node[*].app[0].source.productionInterval = uniform(0,1) < 0.875 ? 1us : exponential(8 * 3478.4e-7s * ${numNodes} / ${load=0.3,0.5,0.7,0.9} / 0.30)
*.node[*].app[1].source.productionInterval = uniform(0,1) < 0.875 ? 1us : exponential(8 * 3478.4e-7s * ${numNodes} / ${load} / 0.20)
*.node[*].app[2].source.productionInterval = uniform(0,1) < 0.875 ? 1us : exponential(8 * 3478.4e-7s * ${numNodes} / ${load} / 0.15)
*.node[*].app[3].source.productionInterval = uniform(0,1) < 0.875 ? 1us : exponential(8 * 3478.4e-7s * ${numNodes} / ${load} / 0.15)
*.node[*].app[4].source.productionInterval = uniform(0,1) < 0.875 ? 1us : exponential(8 * 3478.4e-7s * ${numNodes} / ${load} / 0.10)
*.node[*].app[5].source.productionInterval = uniform(0,1) < 0.875 ? 1us : exponential(8 * 3478.4e-7s * ${numNodes} / ${load} / 0.10)

[S4_Mixed]
description = "S4: 2 safety ECUs send 64-byte frames every 1 ms, 6 send large frames"
# Safety flows on node[0] and node[1]: 672 bit times per 1 ms, 13.44 % of the bus.
*.node[0..1].numApps = 1
*.node[0..1].app[0].source.packetLength = 46B
*.node[0..1].app[0].source.productionInterval = 1ms
*.node[0..1].app[0].source.initialProductionOffset = uniform(0ms, 1ms)
# Background: 512, 1024 and 1518 bytes, weights 0.3, 0.3, 0.4 (mean 8894.4 bits).
*.node[2..].numApps = 3
*.node[2..].app[0].source.packetLength = 494B
*.node[2..].app[1].source.packetLength = 1006B
*.node[2..].app[2].source.packetLength = 1500B
*.node[2..].app[0].source.productionInterval = exponential(8894.4e-7s * 6 / max(${load=0.3,0.5,0.7,0.9} - 0.1344, 0.01) / 0.3)
*.node[2..].app[1].source.productionInterval = exponential(8894.4e-7s * 6 / max(${load} - 0.1344, 0.01) / 0.3)
*.node[2..].app[2].source.productionInterval = exponential(8894.4e-7s * 6 / max(${load} - 0.1344, 0.01) / 0.4)

# ---- Work Plan Phase 5 --------------------------------------------------------
# Safety flows use a 10 ms deadline: the standards-only governor cannot guarantee
# 2 ms with full-size background frames (see the paper). Bursts of 8 on the safety
# nodes are the smallest base setting the governor accepts.

[Adaptive]
abstract = true
**.adaptive = true
*.*.eth[*].plca.typename = "AdaptivePlca"
**.controllerLogic.maxFrameBytes = "64 64 1518 1518 1518 1518 1518 1518"
**.controllerLogic.safetyNodes = "0 1"
**.controllerLogic.safetyDeadline = 10ms

[B3_FixedPriority]
description = "S4 with safety nodes first and enough burst to keep their queues stable"
extends = S4_Mixed, Adaptive
**.controllerLogic.mode = "off"
**.controllerLogic.baseBurst = "8 8 0 0 0 0 0 0"

[B4_ReactiveEwma]
description = "Adaptation from the measured state, no ML"
extends = S4_Mixed, Adaptive
**.controllerLogic.mode = "ewma"
**.controllerLogic.baseBurst = "8 8 0 0 0 0 0 0"

[P_Proposed]
description = "TinyML, policy engine and safety governor"
extends = S4_Mixed, Adaptive
**.controllerLogic.mode = "tinyml"
**.controllerLogic.baseBurst = "8 8 0 0 0 0 0 0"

[B2_BestStatic]
description = "Static burst counts, tuned offline by choosing the best per load. bg=0 is B3."
extends = S4_Mixed, Adaptive
**.controllerLogic.mode = "off"
**.controllerLogic.baseBurst = "8 8 ${bg=1,3,7} ${bg} ${bg} ${bg} ${bg} ${bg}"

[B2_Tuned]
description = "B2 with the smallest safety burst that keeps the safety queues stable at each background burst"
extends = S4_Mixed, Adaptive
**.controllerLogic.mode = "off"
**.controllerLogic.baseBurst = "${bs=17,34} ${bs} ${bg=1,3 ! bs} ${bg} ${bg} ${bg} ${bg} ${bg}"

# Plan 3.1: conventional PLCA windows for training TinyML, three seeds per load.
[Dataset]
abstract = true
**.controllerLogic.mode = "off"
**.controllerLogic.windowSize = 5ms
**.controllerLogic.windowLog = "results/windows/${configname}-${runnumber}.csv"
repeat = 3

[Dataset_S2]
extends = Dataset, S1_S2_Uniform, Adaptive

[Dataset_S3]
extends = Dataset, S3_Bursty, Adaptive

[Dataset_S4]
extends = Dataset, S4_Mixed, Adaptive

# With 10 ms of deadline the bound has no room for extra background burst, so the
# plan's comparisons run at 20 ms. A safety room R = floor(D / (P + S)) frames per
# cycle allows cycles up to R * P. For P = 1 ms and 64-byte frames, R is 9 at 10 ms,
# 14 at 15 ms, 18 at 20 ms and 28 at 30 ms; the safety burst setting is R - 1.
[Room20]
abstract = true
**.controllerLogic.safetyDeadline = 20ms
**.controllerLogic.baseBurst = "17 17 0 0 0 0 0 0"

[B3_20]
extends = Room20, B3_FixedPriority

[B4_20]
extends = Room20, B4_ReactiveEwma

[P20]
extends = Room20, P_Proposed

[A1_20]
description = "Proposed without the governor"
extends = P20
**.controllerLogic.governor = false

[A2_20]
description = "Proposed with safety nodes last in the cycle"
extends = P20
*.node[0].eth[*].plca.local_nodeID = 7
*.node[1].eth[*].plca.local_nodeID = 8
*.node[6].eth[*].plca.local_nodeID = 1
*.node[7].eth[*].plca.local_nodeID = 2

[A3_20]
description = "Random states, to show the governor holds the bound"
extends = P20
**.controllerLogic.mode = "wrong"

[M_20]
description = "Decision tree in place of the int8 MLP"
extends = P20
**.controllerLogic.mode = "tree"

[W2_20]
description = "2 ms windows with the model trained on 5 ms"
extends = P20
**.controllerLogic.windowSize = 2ms

[W20_20]
description = "20 ms windows with the model trained on 5 ms"
extends = P20
**.controllerLogic.windowSize = 20ms

[D15_Deadline]
extends = P_Proposed
**.controllerLogic.safetyDeadline = 15ms
**.controllerLogic.baseBurst = "13 13 0 0 0 0 0 0"

[D30_Deadline]
extends = P_Proposed
**.controllerLogic.safetyDeadline = 30ms
**.controllerLogic.baseBurst = "27 27 0 0 0 0 0 0"

# S4 safety flows with bursty background: adaptation has something to react to.
[S5_MixedBursty]
description = "Safety flows as S4. Background in bursts of about 8 frames, as S3."
extends = S4_Mixed
*.node[2..].app[0].source.productionInterval = uniform(0,1) < 0.875 ? 1us : exponential(8 * 8894.4e-7s * 6 / max(${load} - 0.1344, 0.01) / 0.3)
*.node[2..].app[1].source.productionInterval = uniform(0,1) < 0.875 ? 1us : exponential(8 * 8894.4e-7s * 6 / max(${load} - 0.1344, 0.01) / 0.3)
*.node[2..].app[2].source.productionInterval = uniform(0,1) < 0.875 ? 1us : exponential(8 * 8894.4e-7s * 6 / max(${load} - 0.1344, 0.01) / 0.4)

[S5_B3]
extends = S5_MixedBursty, Adaptive
**.controllerLogic.mode = "off"
**.controllerLogic.baseBurst = "8 8 0 0 0 0 0 0"

[S5_B4]
extends = S5_B3
**.controllerLogic.mode = "ewma"

[S5_P]
extends = S5_B3
**.controllerLogic.mode = "tinyml"

[S5_B3_20]
extends = Room20, S5_B3

[S5_B4_20]
extends = Room20, S5_B4

[S5_P20]
extends = Room20, S5_P

# One short run per load, for the plan's time series around bursts.
[T_Conventional]
extends = S5_MixedBursty, Adaptive
**.controllerLogic.mode = "off"
**.controllerLogic.windowLog = "results/windows/${configname}-${runnumber}.csv"
repeat = 1
sim-time-limit = 10s

[T_Proposed]
extends = S5_P20
**.controllerLogic.windowLog = "results/windows/${configname}-${runnumber}.csv"
repeat = 1
sim-time-limit = 10s
